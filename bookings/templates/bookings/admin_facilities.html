{% extends "bookings/base.html" %}
{% block content %}
<div class="page-header mb-4">
    <h2 class="page-title"><i class="ti ti-tags"></i> Kelola Fasilitas</h2>
</div>

<div class="card mb-4">
    <div class="card-body">
        <form method="post" action="{% url 'add_facility' %}">
            {% csrf_token %}
            <div class="input-group">
                <input type="text" name="name" class="form-control" placeholder="Nama fasilitas" required>
                <button type="submit" class="btn btn-primary"><i class="ti ti-plus"></i> Tambah</button>
            </div>
        </form>
    </div>
</div>

<div class="card">
    <div class="table-responsive">
        <table class="table table-vcenter card-table">
            <thead>
                <tr>
                    <th>Fasilitas</th>
                    <th class="w-1"></th>
                </tr>
            </thead>
            <tbody>
                {% for f in facilities %}
                <tr>
                    <td>{{ f.name }}</td>
                    <td>
                        <a href="{% url 'delete_facility' f.id %}" class="btn btn-sm btn-outline-danger" 
                        onclick="return confirm('Hapus fasilitas ini?')" title="Hapus">
                            <i class="ti ti-trash"></i> Hapus
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
