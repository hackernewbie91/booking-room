{% extends "bookings/base.html" %}
{% block content %}
<div class="page-header mb-4">
    <h2 class="page-title"><i class="ti ti-settings"></i> Pengaturan</h2>
</div>

<div class="card mb-4">
    <div class="card-header"><h3 class="card-title">Mode Persetujuan</h3></div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="action" value="approval_mode">
            <label class="form-check form-switch">
                <input class="form-check-input" type="checkbox" name="approval_mode" value="on" 
                       {% if approval_mode %}checked{% endif %} onchange="this.form.submit()">
                <span class="form-check-label">
                    {% if approval_mode %}ON{% else %}OFF{% endif %}
                </span>
            </label>
        </form>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <h3 class="card-title"><i class="ti ti-clock"></i> Mode Jam Kerja</h3>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="action" value="working_hours_mode">

            <div class="mb-3">
                <label class="form-check form-switch">
                    <input type="checkbox" name="working_hours_mode" value="working" class="form-check-input" 
                           {% if working_hours_mode == 'working' %}checked{% endif %}
                           onchange="this.form.submit()">
                    <span class="form-check-label">
                        {% if working_hours_mode == 'working' %}
                            Mode Jam Kerja Aktif
                        {% else %}
                            Mode Jam Kerja Nonaktif (Bebas)
                        {% endif %}
                    </span>
                </label>
            </div>

            <div id="workingHoursOptions" style="display: {% if working_hours_mode == 'working' %}block{% else %}none{% endif %};">
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Jam Mulai</label>
                        <input type="time" name="work_start" class="form-control" value="{{ work_start }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Jam Selesai</label>
                        <input type="time" name="work_end" class="form-control" value="{{ work_end }}">
                    </div>
                </div>

                <label class="form-label">Hari Kerja</label>
                <div class="row g-2">
                    {% for day_code, day_name in day_choices %}
                    <div class="col-auto">
                        <label class="form-check">
                            <input class="form-check-input" type="checkbox" name="work_days" value="{{ day_code }}"
                                {% if day_code in work_days %}checked{% endif %}>
                            <span class="form-check-label">{{ day_name }}</span>
                        </label>
                    </div>
                    {% endfor %}
                </div>
            </div>

            <button type="submit" class="btn btn-primary mt-3">
                <i class="ti ti-device-floppy"></i> Simpan Pengaturan Jam Kerja
            </button>
        </form>
    </div>
</div>
{% endblock %}
