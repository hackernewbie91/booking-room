{% extends "bookings/base.html" %}
{% block content %}
<div class="page-header mb-4">
    <h2 class="page-title"><i class="ti ti-building"></i> Identitas Perusahaan</h2>
</div>

<div class="row row-cards">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header"><h3 class="card-title">Nama Perusahaan</h3></div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <input type="hidden" name="action" value="save_name">
                    <div class="mb-3">
                        <label class="form-label">Nama</label>
                        <input type="text" name="company_name" class="form-control" value="{{ company_name }}">
                    </div>
                    <button type="submit" class="btn btn-primary">Simpan</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card">
            <div class="card-header"><h3 class="card-title">Logo</h3></div>
            <div class="card-body">
                {% if logo_url %}
                <img src="{{ logo_url }}" style="max-height: 50px; margin-bottom: 16px;">
                {% endif %}
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <input type="hidden" name="action" value="upload_logo">
                    <input type="file" name="company_logo" class="form-control mb-3">
                    <button type="submit" class="btn btn-primary">Upload</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
