{% extends "bookings/base.html" %}
{% block content %}
<div class="page-header mb-4">
    <h2 class="page-title"><i class="ti ti-star"></i> Review Ruangan</h2>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Rating</label>
                <div class="d-flex gap-2">
                    {% for i in "12345" %}
                    <button type="button" class="btn btn-outline-warning" onclick="setRating({{ forloop.counter }})">
                        <i class="ti ti-star"></i>
                    </button>
                    {% endfor %}
                </div>
                <input type="hidden" name="rating" id="ratingInput" value="5">
            </div>
            <div class="mb-3">
                <label class="form-label">Komentar</label>
                <textarea name="comment" class="form-control" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary"><i class="ti ti-send"></i> Kirim Review</button>
        </form>
    </div>
</div>
{% endblock %}
