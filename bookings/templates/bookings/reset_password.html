{% extends "bookings/base.html" %}
{% block content %}
<div class="page-header">
    <h2><i class="fas fa-key"></i> Reset Password: {{ reset_user.username }}</h2>
    <a href="{% url 'manage_users' %}" class="btn btn-sm"><i class="fas fa-arrow-left"></i> Kembali</a>
</div>

<div class="dashboard-card" style="max-width: 500px;">
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label><i class="fas fa-lock"></i> Password Baru</label>
            <input class="form-control" type="password" name="password1" required minlength="8">
        </div>
        <div class="form-group">
            <label><i class="fas fa-lock"></i> Konfirmasi Password Baru</label>
            <input class="form-control" type="password" name="password2" required minlength="8">
        </div>
        <button type="submit" class="btn btn-warning"><i class="fas fa-save"></i> Reset Password</button>
    </form>
</div>
{% endblock %}
