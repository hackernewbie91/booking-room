{% extends "bookings/base.html" %}
{% block content %}
<div class="page-header mb-4">
    <h2 class="page-title"><i class="ti ti-user-edit"></i> Edit User: {{ edit_user.username }}</h2>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" value="{{ edit_user.username }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" value="{{ edit_user.email|default:'' }}">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-check form-switch">
                    <input type="checkbox" name="is_admin" class="form-check-input" 
                           {% if edit_user.is_superuser %}checked{% endif %}>
                    <span class="form-check-label">Admin (Superuser)</span>
                </label>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="ti ti-device-floppy"></i> Simpan</button>
                <a href="{% url 'manage_users' %}" class="btn btn-outline-secondary"><i class="ti ti-arrow-left"></i> Kembali</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
