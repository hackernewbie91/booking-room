{% extends "bookings/base.html" %}
{% block content %}
<div class="page-header">
    <h2><i class="fas fa-edit"></i> Edit User: {{ edit_user.username }}</h2>
</div>

<div class="dashboard-card" style="max-width: 600px; margin: 0 auto;">
    <h3 style="margin-bottom: 24px;"><i class="fas fa-user-edit"></i> Form Edit User</h3>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label><i class="fas fa-user"></i> Username</label>
            <input class="form-control" name="username" value="{{ edit_user.username }}" required>
        </div>
        <div class="form-group">
            <label><i class="fas fa-envelope"></i> Email (opsional)</label>
            <input class="form-control" type="email" name="email" value="{{ edit_user.email|default:'' }}" placeholder="Email">
        </div>
        <div class="form-group">
            <label class="facility-tag" style="display: inline-flex; cursor: pointer; padding: 12px 20px; font-size: 1rem;">
                <input type="checkbox" name="is_admin" {% if edit_user.is_superuser %}checked{% endif %}>
                <span><i class="fas fa-shield-alt"></i> Admin (Superuser)</span>
            </label>
        </div>
        <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Simpan Perubahan</button>
        <a href="{% url 'manage_users' %}" class="btn"><i class="fas fa-arrow-left"></i> Kembali</a>
    </form>
</div>
{% endblock %}
