{% extends "bookings/base.html" %}
{% block content %}
<div class="page-header">
    <h2><i class="fas fa-trash"></i> Hapus User: {{ delete_user.username }}</h2>
    <a href="{% url 'manage_users' %}" class="btn btn-sm"><i class="fas fa-arrow-left"></i> Kembali</a>
</div>

<div class="dashboard-card text-center" style="max-width: 500px;">
    <div class="modal-icon">
        <i class="fas fa-exclamation-triangle"></i>
    </div>
    <h3>Konfirmasi Penghapusan</h3>
    <p>Anda yakin ingin menghapus user <strong>{{ delete_user.username }}</strong>?</p>
    <p class="text-muted">Semua booking user ini juga akan ikut terhapus.</p>
    
    <form method="post" class="mt-3">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i> Ya, Hapus</button>
        <a href="{% url 'manage_users' %}" class="btn">Batal</a>
    </form>
</div>
{% endblock %}
