{% extends "bookings/base.html" %}
{% block content %}
<div class="page-header mb-4">
    <h2 class="page-title"><i class="ti ti-plus"></i> Tambah Ruangan</h2>
</div>

<div class="card">
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Nama Ruangan</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Kapasitas</label>
                    <input type="number" name="capacity" class="form-control">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Foto Ruangan</label>
                <input type="file" name="image" class="form-control" accept="image/*">
            </div>
            <div class="mb-3">
                <label class="form-label">Deskripsi</label>
                <textarea name="description" class="form-control" rows="3"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Fasilitas</label>
                <div class="form-selectgroup">
                    {% for f in facilities %}
                    <label class="form-selectgroup-item">
                        <input type="checkbox" name="facilities" value="{{ f.id }}" class="form-selectgroup-input">
                        <span class="form-selectgroup-label">{{ f.name }}</span>
                    </label>
                    {% endfor %}
                </div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="ti ti-device-floppy"></i> Simpan</button>
                <a href="{% url 'admin_rooms' %}" class="btn btn-outline-secondary"><i class="ti ti-arrow-left"></i> Kembali</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
